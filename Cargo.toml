[workspace]
resolver = "2"
members = ["crates/agent-loop", "crates/host"]

[workspace.package]
# 版本对齐内核：react-agent 的 <version> 表示「基于 agent-kernel 同版本构建」（见下方 dependency 的 tag）。
# 例如 0.1.x 对应内核 v0.1.1；后续针对已知限制（运行中断 / sid 唯一性）迭代时再 bump 次版本号。
version = "0.1.4"
edition = "2021"

[workspace.dependencies]
# 内核（发布版：git 依赖，锁定 v0.1.1 —— 含 Process 域 destroy 同步 kill 修复；react-agent 0.1.x 对应内核 v0.1.1）
agent-kernel-sdk = { git = "https://github.com/zh2673-git/agent-kernel", tag = "v0.1.1" }
agent-kernel-kernel = { git = "https://github.com/zh2673-git/agent-kernel", tag = "v0.1.1", features = [
    "process",
] }
agent-kernel-process = { git = "https://github.com/zh2673-git/agent-kernel", tag = "v0.1.1" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 本地开发：切换到旁边的内核 checkout（取消注释后 cargo build 即用本地源码）
