[workspace]
resolver = "2"
members = ["crates/agent-loop", "crates/host"]

[workspace.package]
# 版本号 = react-agent 发布序号（随功能发布 +1，与 git tag v<version> 同步）。
# 内核兼容性由下方 dependency 的 tag 表达（升级内核时单独提交说明），不再与本版本号对齐。
version = "0.1.13"
edition = "2021"

[workspace.dependencies]
# 内核（发布版：git 依赖，锁定 v0.1.3 —— K1 hot_swap 补 drain（B4 闭合）/ K3 事件总线收口（K505 fail-fast）/ K4 step/trace_id 弃用标注）
agent-kernel-sdk = { git = "https://github.com/zh2673-git/agent-kernel", tag = "v0.1.3" }
agent-kernel-kernel = { git = "https://github.com/zh2673-git/agent-kernel", tag = "v0.1.3", features = [
    "process",
] }
agent-kernel-process = { git = "https://github.com/zh2673-git/agent-kernel", tag = "v0.1.3" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 本地开发：切换到旁边的内核 checkout（取消注释后 cargo build 即用本地源码）
# [patch."https://github.com/zh2673-git/agent-kernel"]
# agent-kernel-sdk = { path = "../agent-kernel/crates/sdk" }
# agent-kernel-kernel = { path = "../agent-kernel/crates/kernel" }
# agent-kernel-process = { path = "../agent-kernel/crates/process" }
