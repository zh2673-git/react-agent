<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>react-agent</title>
<style>
  :root {
    --bg: #141414; --panel: #1e1e1e; --card: #252525; --border: #333;
    --text: #e4e4e4; --muted: #8a8a8a; --accent: #4b8bbe; --ok: #4caf7d; --err: #e06c60;
    --user-bubble: #2a3f55;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 "Segoe UI", system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header .logo { font-weight: 700; letter-spacing: .5px; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  header .dot.live { background: var(--ok); }
  header .session { color: var(--muted); cursor: pointer; border-bottom: 1px dashed var(--muted); }
  header .status { margin-left: auto; color: var(--muted); font-size: 12px; }
  #stream { flex: 1; overflow-y: auto; padding: 20px 0; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; }
  .ev { margin: 10px 0; }
  .ev.user { display: flex; justify-content: flex-end; }
  .ev.user .bubble { background: var(--user-bubble); padding: 8px 14px; border-radius: 12px; max-width: 75%; white-space: pre-wrap; }
  .ev.assistant .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; }
  .ev.assistant .meta { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .ev.error .banner { background: rgba(224,108,96,.12); border: 1px solid var(--err); color: var(--err); border-radius: 8px; padding: 8px 14px; font-family: Consolas, monospace; font-size: 13px; white-space: pre-wrap; }
  .ev.compaction { text-align: center; color: var(--muted); font-size: 12px; }
  .ev.compaction .line { display: inline-block; padding: 2px 12px; border: 1px dashed var(--border); border-radius: 10px; }
  details.tool { background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
  details.tool summary { cursor: pointer; padding: 7px 12px; list-style: none; display: flex; align-items: center; gap: 8px; font-size: 13px; }
  details.tool summary::-webkit-details-marker { display: none; }
  details.tool summary .spin { color: var(--accent); animation: blink 1s infinite; }
  details.tool summary .ms { color: var(--muted); margin-left: auto; font-size: 12px; }
  details.tool .body { padding: 4px 12px 10px; border-top: 1px solid var(--border); }
  details.tool pre { background: var(--bg); border-radius: 6px; padding: 8px 10px; overflow-x: auto; font: 12px/1.5 Consolas, monospace; white-space: pre-wrap; word-break: break-all; margin-top: 6px; }
  details.tool.done summary .spin { display: none; }
  details.tool.fail summary .name { color: var(--err); }
  details.tool.ok summary .ms::before { content: "✓ "; color: var(--ok); }
  @keyframes blink { 50% { opacity: .3; } }
  .md h1, .md h2, .md h3 { margin: 10px 0 6px; }
  .md p { margin: 6px 0; }
  .md ul, .md ol { margin: 6px 0 6px 22px; }
  .md code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font: 12.5px Consolas, monospace; }
  .md pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
  .md pre code { border: none; background: none; padding: 0; }
  .md a { color: var(--accent); }
  .md blockquote { border-left: 3px solid var(--border); padding-left: 10px; color: var(--muted); margin: 6px 0; }
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 20px; }
  .composer { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; }
  .composer textarea { flex: 1; resize: none; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font: inherit; height: 44px; max-height: 160px; outline: none; }
  .composer textarea:focus { border-color: var(--accent); }
  .composer button { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 22px; font: inherit; cursor: pointer; }
  .composer button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <span class="dot" id="conn"></span>
  <span class="logo">react-agent</span>
  <span class="session" id="session" title="点击切换会话">session: -</span>
  <span class="status" id="status"></span>
</header>
<div id="stream"><div class="wrap" id="feed"></div></div>
<footer>
  <div class="composer">
    <textarea id="input" placeholder="输入消息，Enter 发送（Shift+Enter 换行）"></textarea>
    <button id="send">发送</button>
  </div>
</footer>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const feed = $("feed"), input = $("input"), sendBtn = $("send"), statusEl = $("status"), connEl = $("conn");

let session = localStorage.getItem("ra.session") || "web";
$("session").textContent = "session: " + session;
$("session").onclick = () => {
  const v = prompt("会话 ID（切换后将重放该会话完整事件日志）", session);
  if (v && v.trim()) { session = v.trim(); localStorage.setItem("ra.session", session); location.reload(); }
};

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

// 极简 markdown 渲染（先转义，再还原受控标签）
function md(src) {
  let text = esc(src);
  const codes = [];
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, body) => {
    codes.push(`<pre><code>${body.replace(/\n$/, "")}</code></pre>`);
    return `\x00${codes.length - 1}\x00`;
  });
  text = text
    .replace(/^###### (.*)$/gm, "<h3>$1</h3>").replace(/^##### (.*)$/gm, "<h3>$1</h3>")
    .replace(/^#### (.*)$/gm, "<h3>$1</h3>").replace(/^### (.*)$/gm, "<h3>$1</h3>")
    .replace(/^## (.*)$/gm, "<h2>$1</h2>").replace(/^# (.*)$/gm, "<h1>$1</h1>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/^&gt; ?(.*)$/gm, "<blockquote>$1</blockquote>");
  const lines = text.split("\n");
  let html = "", list = null, para = [];
  const flushPara = () => { if (para.length) { html += `<p>${para.join("<br>")}</p>`; para = []; } };
  const flushList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const ln of lines) {
    const t = ln.trim();
    let m;
    if (!t) { flushPara(); flushList(); continue; }
    if (/^\x00\d+\x00$/.test(t)) { flushPara(); flushList(); html += t; continue; }
    if ((m = t.match(/^[-*] (.*)$/))) { flushPara(); if (list !== "ul") { flushList(); html += "<ul>"; list = "ul"; } html += `<li>${m[1]}</li>`; continue; }
    if ((m = t.match(/^\d+[.)] (.*)$/))) { flushPara(); if (list !== "ol") { flushList(); html += "<ol>"; list = "ol"; } html += `<li>${m[1]}</li>`; continue; }
    if (/^<(h\d|blockquote|pre|ul|ol)/.test(t)) { flushPara(); flushList(); html += t; continue; }
    flushList(); para.push(t);
  }
  flushPara(); flushList();
  return html.replace(/\x00(\d+)\x00/g, (_, i) => codes[+i]);
}

function el(html) { const d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }
function scroll() { const s = $("stream"); s.scrollTop = s.scrollHeight; }
function setStatus(t) { statusEl.textContent = t || ""; }

// 事件渲染：tool_result 回填最近的同名 pending 卡片
const pending = new Map();
function render(ev) {
  const ts = ev.ts ? new Date(ev.ts).toLocaleTimeString() : "";
  switch (ev.type) {
    case "user":
      feed.appendChild(el(`<div class="ev user"><div class="bubble">${esc(ev.text)}</div></div>`));
      break;
    case "assistant":
      feed.appendChild(el(`<div class="ev assistant"><div class="card"><div class="meta">${ts}</div><div class="md">${md(ev.answer ?? "")}</div></div></div>`));
      break;
    case "tool_call": {
      const card = el(`<details class="tool" open><summary><span class="spin">▶</span><span class="name">⚙ ${esc(ev.name)}</span><span class="round">round ${esc(ev.round)}</span><span class="ms"></span></summary><div class="body">参数<pre>${esc(JSON.stringify(ev.args ?? {}, null, 2))}</pre><div class="result"></div></div></details>`);
      feed.appendChild(card);
      pending.set(`${ev.round}|${ev.name}`, card);
      break;
    }
    case "tool_result": {
      const key = `${ev.round}|${ev.name}`;
      let card = pending.get(key);
      if (!card) { // 断线重放时 tool_call 可能已渲染后回填；找不到则重建
        card = el(`<details class="tool"><summary><span class="spin"></span><span class="name">⚙ ${esc(ev.name)}</span><span class="round">round ${esc(ev.round)}</span><span class="ms"></span></summary><div class="body"><div class="result"></div></div></details>`);
        feed.appendChild(card);
      }
      card.classList.add("done", ev.ok ? "ok" : "fail");
      card.querySelector(".ms").textContent = `${ev.ms ?? "?"}ms`;
      card.querySelector(".result").innerHTML = `结果${ev.ok ? "" : "（失败）"}<pre>${esc(ev.result_truncated ?? "")}</pre>`;
      pending.delete(key);
      break;
    }
    case "compaction":
      feed.appendChild(el(`<div class="ev compaction"><span class="line">── 上下文已压缩（摘要 ${esc(ev.summarized)} 条，保留 ${esc(ev.kept)} 条）──</span></div>`));
      break;
    case "error":
      feed.appendChild(el(`<div class="ev error"><div class="banner">✗ [${esc(ev.where ?? "?")}] ${esc(ev.message ?? "")}</div></div>`));
      setStatus("出错");
      break;
    default:
      return; // 未知事件类型：忽略（前向兼容）
  }
  scroll();
}

// SSE：连接建立即从 0 全量重放（刷新恢复 = 日志重放），随后跟随实时增量
let es = null;
function connect() {
  if (es) es.close();
  feed.innerHTML = ""; pending.clear();
  es = new EventSource(`/api/events?session=${encodeURIComponent(session)}&after=0`);
  es.onopen = () => { connEl.classList.add("live"); setStatus(""); };
  es.onerror = () => { connEl.classList.remove("live"); setStatus("连接断开，重连中…"); };
  es.onmessage = (m) => { try { render(JSON.parse(m.data)); } catch { /* 忽略损坏行 */ } };
}
connect();

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = ""; input.style.height = "44px";
  sendBtn.disabled = true; setStatus("思考中…");
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ session_id: session, message: text }),
    });
    const v = await r.json();
    if (!v.ok) setStatus("失败: " + (v.error?.message ?? r.status));
    else setStatus("");
  } catch (e) { setStatus("请求失败: " + e); }
  finally { sendBtn.disabled = false; input.focus(); }
}
sendBtn.onclick = send;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
input.focus();
</script>
</body>
</html>
