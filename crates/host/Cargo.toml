[package]
name = "react-agent-host"
description = "宿主二进制：装配 agent-kernel，spawn Python/TS guest 插件，注册 agent-loop 并提供单轮/REPL 聊天"
version.workspace = true
edition.workspace = true
default-run = "react-agent-host"

[dependencies]
react-agent-agent-loop = { path = "../agent-loop" }
agent-kernel-sdk.workspace = true
agent-kernel-kernel.workspace = true
agent-kernel-process.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# sandbox-run（Windows 受限令牌沙箱助手，宿主层 fail-closed）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_AppLocker",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
